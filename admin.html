<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Neon Panel</title>
  <style>
    /* ========== CSS VARIABLES ========== */
    :root {
      --bg: #0a0a14;
      --surface: rgba(20, 20, 40, 0.6);
      --surface-hover: rgba(30, 30, 60, 0.8);
      --primary: #7c3aed;
      --primary-glow: rgba(124, 58, 237, 0.6);
      --cyan: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 260px;
      background: rgba(10, 10, 20, 0.9);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
      font-weight: 500;
      text-decoration: none;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-size: 15px;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(124, 58, 237, 0.2);
      color: white;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
    }

    .nav-item .icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    /* ========== MAIN CONTENT ========== */
    .main {
      flex: 1;
      min-width: 0;
      padding: 20px 24px;
    }

    /* ========== TOP HEADER ========== */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 16px;
      gap: 8px;
      width: 280px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      width: 100%;
      font-size: 14px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all var(--transition);
      position: relative;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
      color: white;
    }

    .notification-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
    }

    .profile-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      cursor: pointer;
      transition: all var(--transition);
    }

    .profile-chip:hover {
      background: var(--surface-hover);
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }

    .profile-name {
      font-size: 14px;
      font-weight: 500;
    }

    /* ========== CARDS & SECTIONS ========== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(10px);
      transition: all var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-detail {
      font-size: 12px;
      color: var(--text-muted);
    }

    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .table-title {
      font-size: 18px;
      font-weight: 600;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th {
      text-align: left;
      padding: 16px 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    .table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: middle;
    }

    .table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .badge-user {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
    }

    .badge-admin {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
    }

    .badge-online {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
    }

    .badge-offline {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--text);
      cursor: pointer;
      transition: all var(--transition);
      font-size: 13px;
      font-weight: 500;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #334155;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
      border: none;
      padding: 0;
    }

    .toggle-switch.enabled {
      background: var(--green);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-switch.enabled::after {
      transform: translateX(20px);
    }

    /* ========== MOBILE RESPONSIVE ========== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .main {
        padding: 16px;
      }
      .table {
        display: block;
        overflow-x: auto;
      }
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <a class="logo" href="/admin">
      <div class="logo-icon">⚡</div>
      Neon Admin
    </a>
    <ul class="nav-list">
      <li><button class="nav-item active" data-page="dashboard"><span class="icon">📊</span> Dashboard</button></li>
      <li><button class="nav-item" data-page="users"><span class="icon">👥</span> Users</button></li>
      <li><button class="nav-item" data-page="devices"><span class="icon">📱</span> Devices</button></li>
      <li><button class="nav-item" data-page="features"><span class="icon">🔐</span> Feature Controls</button></li>
      <li><button class="nav-item" data-page="builds"><span class="icon">📦</span> APK Builds</button></li>
      <li><button class="nav-item" data-page="activity"><span class="icon">📈</span> Activity</button></li>
      <li><button class="nav-item" data-page="settings"><span class="icon">⚙️</span> Settings</button></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <div class="main">
    <!-- Top Header -->
    <header class="top-header">
      <h1 class="page-title">Admin Dashboard</h1>
      <div class="header-actions">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" placeholder="Search users or devices..." id="globalSearch">
        </div>
        <button class="icon-btn" onclick="toggleSidebar()">
          ☰
        </button>
        <div class="icon-btn">
          🔔
          <span class="notification-dot"></span>
        </div>
        <div class="profile-chip" onclick="showAdminProfile()">
          <div class="profile-avatar" id="adminInitials">A</div>
          <span class="profile-name">Admin</span>
        </div>
      </div>
    </header>

    <!-- Page Content Container -->
    <div id="pageContent">
      <!-- Dashboard Overview (default) -->
      <section id="dashboardSection">
        <div class="dashboard-grid" id="statsGrid">
          <!-- Will be filled by JS -->
        </div>
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">Recent Users</span>
            <button class="action-btn" onclick="showUsers()">View All</button>
          </div>
          <div id="recentUsersTable"></div>
        </div>
      </section>

      <!-- Users Section -->
      <section id="usersSection" style="display: none;">
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">Registered Users</span>
            <button class="action-btn" onclick="refreshUsers()">🔄 Refresh</button>
          </div>
          <div id="usersTableContainer"></div>
        </div>
      </section>

      <!-- Devices Section -->
      <section id="devicesSection" style="display: none;">
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">All Devices</span>
            <button class="action-btn" onclick="refreshDevices()">🔄 Refresh</button>
          </div>
          <div id="allDevicesContainer"></div>
        </div>
      </section>

      <!-- Feature Controls Section -->
      <section id="featuresSection" style="display: none;">
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">Feature Permissions (Per User)</span>
            <button class="action-btn" onclick="refreshUsers()">🔄 Refresh</button>
          </div>
          <div id="featureUsersContainer"></div>
        </div>
      </section>

      <!-- APK Builds (placeholder) -->
      <section id="buildsSection" style="display: none;">
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">APK Builds</span>
          </div>
          <div style="padding: 30px; text-align: center; color: var(--text-muted);">No build history available.</div>
        </div>
      </section>

      <!-- Activity (placeholder) -->
      <section id="activitySection" style="display: none;">
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">Administrative Activity</span>
          </div>
          <div style="padding: 30px; text-align: center; color: var(--text-muted);">Recent activity will appear here.</div>
        </div>
      </section>

      <!-- Settings (placeholder) -->
      <section id="settingsSection" style="display: none;">
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">Admin Settings</span>
          </div>
          <div style="padding: 30px; text-align: center; color: var(--text-muted);">Settings coming soon.</div>
        </div>
      </section>
    </div>
  </div>

  <!-- User Detail Drawer -->
  <div id="userDrawer" style="position: fixed; top:0; right:-400px; width: 380px; height:100vh; background: rgba(15,15,30,0.98); backdrop-filter: blur(20px); border-left:1px solid var(--border); transition: right 0.3s; z-index: 200; overflow-y:auto;">
    <!-- Drawer content will be injected -->
  </div>
  <div id="drawerOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:199;"></div>

  <!-- Feature Modal -->
  <div id="featureModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:300; align-items:center; justify-content:center;">
    <div style="background: #1a1a2e; border-radius: var(--radius); padding: 25px; width: 90%; max-width: 500px; border: 1px solid var(--border);">
      <h3 id="featureModalTitle">Manage Features</h3>
      <div id="featureModalContent"></div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button class="action-btn" onclick="closeFeatureModal()">Cancel</button>
        <button class="action-btn" style="background:var(--primary); color:white; border:none;" onclick="saveFeatureModal()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // ========== GLOBALS ==========
    let currentPage = 'dashboard';
    let allUsers = [];
    let allDevices = [];
    let selectedUserUid = null;
    let selectedUserFeatures = {};

    // ========== UTILITY FUNCTIONS ==========
    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function getAdminInitials() {
      return 'A';
    }

    // ========== SIDEBAR ==========
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const page = this.dataset.page;
        switchPage(page);
        // close sidebar on mobile
        if (window.innerWidth < 768) {
          document.getElementById('sidebar').classList.remove('open');
        }
      });
    });

    function switchPage(page) {
      currentPage = page;
      // update active nav
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
      // show relevant section
      const sections = ['dashboardSection','usersSection','devicesSection','featuresSection','buildsSection','activitySection','settingsSection'];
      sections.forEach(sec => document.getElementById(sec).style.display = 'none');
      document.getElementById(page + 'Section').style.display = 'block';
      // load data
      if (page === 'dashboard') loadDashboard();
      else if (page === 'users') loadUsers();
      else if (page === 'devices') loadAllDevices();
      else if (page === 'features') loadUsers(); // same user list
      // other pages placeholder
    }

    // ========== API CALLS ==========
    async function apiGet(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      return await res.json();
    }

    async function apiPost(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('API error');
      return await res.json();
    }

    // ========== DASHBOARD ==========
    async function loadDashboard() {
      try {
        const usersData = await apiGet('/api/admin/users');
        const devicesData = await apiGet('/api/admin/devices');
        allUsers = usersData.users || [];
        allDevices = devicesData.devices || [];
        renderStats();
        renderRecentUsers();
      } catch (e) {
        console.error(e);
        document.getElementById('statsGrid').innerHTML = '<div style="color:red;">Error loading dashboard</div>';
      }
    }

    function renderStats() {
      const totalUsers = allUsers.length;
      const totalDevices = allDevices.length;
      const onlineDevices = allDevices.filter(d => d.online).length;
      const lockedFeatures = 0; // will be calculated if available
      const stats = [
        { label: 'Total Users', value: totalUsers, detail: 'Registered accounts' },
        { label: 'Total Devices', value: totalDevices, detail: 'Across all users' },
        { label: 'Online Devices', value: onlineDevices, detail: 'Currently active' },
        { label: 'Total APK Builds', value: 0, detail: 'No builds yet' },
      ];
      document.getElementById('statsGrid').innerHTML = stats.map(s => `
        <div class="stat-card">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value">${s.value}</div>
          <div class="stat-detail">${s.detail}</div>
        </div>
      `).join('');
    }

    function renderRecentUsers() {
      const recent = allUsers.slice(0, 5);
      const container = document.getElementById('recentUsersTable');
      if (recent.length === 0) {
        container.innerHTML = '<div style="padding:20px; color:var(--text-muted);">No users found.</div>';
        return;
      }
      let html = `<table class="table"><thead><tr>
        <th>User</th><th>Role</th><th>Devices</th><th>Last Active</th><th>Actions</th>
      </tr></thead><tbody>`;
      recent.forEach(user => {
        const initials = user.email ? user.email.substring(0,1).toUpperCase() : 'U';
        const roleBadge = user.role === 'ADMIN' ? 'badge-admin' : 'badge-user';
        html += `<tr>
          <td>
            <div class="user-cell">
              <div class="avatar" style="background:${user.role==='ADMIN'?'#7c3aed':'#06b6d4'}">${initials}</div>
              <div>
                <div>${escapeHtml(user.name || user.email)}</div>
                <div style="color:var(--text-muted); font-size:12px;">${escapeHtml(user.email)}</div>
              </div>
            </div>
          </td>
          <td><span class="badge ${roleBadge}">${user.role || 'USER'}</span></td>
          <td>${user.deviceCount || 0}</td>
          <td>${user.lastActive || '—'}</td>
          <td><button class="action-btn" onclick="openUserDrawer('${user.uid || user.id}')">View</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // ========== USERS ==========
    async function loadUsers() {
      try {
        const data = await apiGet('/api/admin/users');
        allUsers = data.users || [];
        renderUsersTable();
      } catch (e) {
        console.error(e);
      }
    }

    function renderUsersTable() {
      const container = document.getElementById('usersTableContainer');
      if (allUsers.length === 0) {
        container.innerHTML = '<div style="padding:20px; color:var(--text-muted);">No users.</div>';
        return;
      }
      let html = `<table class="table"><thead><tr>
        <th>USER</th><th>ROLE</th><th>DEVICES</th><th>BUILDS</th><th>LAST ACTIVE</th><th>FEATURES</th><th>ACTIONS</th>
      </tr></thead><tbody>`;
      allUsers.forEach(user => {
        const initials = user.email ? user.email.substring(0,1).toUpperCase() : 'U';
        const roleBadge = user.role === 'ADMIN' ? 'badge-admin' : 'badge-user';
        const features = user.features || {};
        const lockedCount = Object.values(features).filter(v => v === false).length;
        html += `<tr>
          <td>
            <div class="user-cell">
              <div class="avatar" style="background:${user.role==='ADMIN'?'#7c3aed':'#06b6d4'}">${initials}</div>
              <div>
                <div>${escapeHtml(user.name || user.email)}</div>
                <div style="color:var(--text-muted); font-size:12px;">${escapeHtml(user.email)}</div>
                <div style="color:var(--text-muted); font-size:10px;">UID: ${user.uid || user.id}</div>
              </div>
            </div>
          </td>
          <td><span class="badge ${roleBadge}">${user.role || 'USER'}</span></td>
          <td>${user.deviceCount || 0}</td>
          <td>${user.buildCount || 0}</td>
          <td>${user.lastActive || '—'}</td>
          <td><button class="action-btn" onclick="openFeatureModal('${user.uid || user.id}')">🔒 ${lockedCount} locked</button></td>
          <td><button class="action-btn" onclick="openUserDrawer('${user.uid || user.id}')">View</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function refreshUsers() {
      await loadUsers();
    }

    // ========== DEVICES ==========
    async function loadAllDevices() {
      try {
        const data = await apiGet('/api/admin/devices');
        allDevices = data.devices || [];
        renderAllDevices();
      } catch (e) {
        console.error(e);
      }
    }

    function renderAllDevices() {
      const container = document.getElementById('allDevicesContainer');
      if (allDevices.length === 0) {
        container.innerHTML = '<div style="padding:20px; color:var(--text-muted);">No devices.</div>';
        return;
      }
      let html = `<table class="table"><thead><tr>
        <th>Device</th><th>Owner</th><th>Battery</th><th>Status</th><th>Last Seen</th><th>Actions</th>
      </tr></thead><tbody>`;
      allDevices.forEach(device => {
        const status = device.online ? 'Online' : 'Offline';
        const statusClass = device.online ? 'badge-online' : 'badge-offline';
        html += `<tr>
          <td>
            <div>
              <div>${escapeHtml(device.device_name || device.name || 'Unknown')}</div>
              <div style="color:var(--text-muted); font-size:12px;">${device.device_id}</div>
            </div>
          </td>
          <td>${escapeHtml(device.owner_email || '—')}</td>
          <td>${device.battery ?? '—'}%</td>
          <td><span class="badge ${statusClass}">${status}</span></td>
          <td>${device.last_seen ? new Date(device.last_seen).toLocaleString() : '—'}</td>
          <td><button class="action-btn" onclick="openDeviceControl('${device.device_id}')">View Device</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function openDeviceControl(deviceId) {
      window.location.href = `/control?deviceId=${deviceId}`;
    }

    async function refreshDevices() {
      await loadAllDevices();
    }

    // ========== USER DRAWER ==========
    async function openUserDrawer(uid) {
      selectedUserUid = uid;
      try {
        const user = allUsers.find(u => (u.uid || u.id) === uid);
        if (!user) return;
        // fetch devices
        const devicesData = await apiGet(`/api/admin/users/${uid}/devices`);
        const featuresData = await apiGet(`/api/admin/users/${uid}/features`);
        const devices = devicesData.devices || [];
        const features = featuresData.features || {};
        renderDrawer(user, devices, features);
        document.getElementById('drawerOverlay').style.display = 'block';
        document.getElementById('userDrawer').style.right = '0';
      } catch (e) {
        console.error(e);
        alert('Failed to load user details');
      }
    }

    function renderDrawer(user, devices, features) {
      const drawer = document.getElementById('userDrawer');
      const initials = (user.name || user.email || 'U').substring(0,1).toUpperCase();
      const roleBadge = user.role === 'ADMIN' ? 'badge-admin' : 'badge-user';
      const featureList = Object.keys(features).map(key => ({
        key,
        enabled: features[key]
      }));
      drawer.innerHTML = `
        <div style="padding:20px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>User Details</h2>
            <button onclick="closeUserDrawer()" style="background:none;border:none;color:white;font-size:24px;">&times;</button>
          </div>
          <div style="display:flex; align-items:center; gap:15px; margin:20px 0;">
            <div class="avatar" style="background:${user.role==='ADMIN'?'#7c3aed':'#06b6d4'}; width:60px; height:60px; font-size:24px;">${initials}</div>
            <div>
              <div style="font-size:20px; font-weight:600;">${escapeHtml(user.name || user.email)}</div>
              <div style="color:var(--text-muted);">${escapeHtml(user.email)}</div>
              <span class="badge ${roleBadge}" style="margin-top:5px;">${user.role || 'USER'}</span>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
            <div><span style="color:var(--text-muted);">UID:</span> ${user.uid || user.id}</div>
            <div><span style="color:var(--text-muted);">Devices:</span> ${user.deviceCount || devices.length}</div>
            <div><span style="color:var(--text-muted);">Builds:</span> ${user.buildCount || 0}</div>
            <div><span style="color:var(--text-muted);">Last Active:</span> ${user.lastActive || '—'}</div>
          </div>
          <h3 style="margin-bottom:10px;">Devices</h3>
          ${devices.length ? devices.map(d => `
            <div style="display:flex; justify-content:space-between; background:rgba(255,255,255,0.03); padding:10px; border-radius:8px; margin-bottom:5px;">
              <span>${escapeHtml(d.device_name || d.name)}</span>
              <span class="badge ${d.online?'badge-online':'badge-offline'}">${d.online?'Online':'Offline'}</span>
              <button class="action-btn" onclick="openDeviceControl('${d.device_id}')">View</button>
            </div>
          `).join('') : '<div style="color:var(--text-muted);">No devices</div>'}
          <h3 style="margin:20px 0 10px;">Feature Permissions</h3>
          ${featureList.map(f => `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span>${f.key}</span>
              <button class="toggle-switch ${f.enabled?'enabled':''}" onclick="toggleUserFeature('${user.uid || user.id}', '${f.key}', ${!f.enabled})"></button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function closeUserDrawer() {
      document.getElementById('drawerOverlay').style.display = 'none';
      document.getElementById('userDrawer').style.right = '-400px';
    }
    document.getElementById('drawerOverlay').addEventListener('click', closeUserDrawer);

    // ========== FEATURE MODAL ==========
    async function openFeatureModal(uid) {
      selectedUserUid = uid;
      try {
        const data = await apiGet(`/api/admin/users/${uid}/features`);
        selectedUserFeatures = data.features || {};
        const modal = document.getElementById('featureModal');
        document.getElementById('featureModalTitle').innerText = `Manage Features for ${uid}`;
        const featureKeys = ['deviceInfo','battery','gps','installedApps','activity','notifications','sync','remoteConfig'];
        const content = document.getElementById('featureModalContent');
        content.innerHTML = featureKeys.map(key => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
            <span>${key}</span>
            <button class="toggle-switch ${selectedUserFeatures[key] ? 'enabled':''}" data-feature="${key}" onclick="toggleFeatureInModal(this)"></button>
          </div>
        `).join('');
        modal.style.display = 'flex';
      } catch (e) {
        console.error(e);
        alert('Failed to load features');
      }
    }

    function toggleFeatureInModal(btn) {
      btn.classList.toggle('enabled');
      const feature = btn.dataset.feature;
      selectedUserFeatures[feature] = btn.classList.contains('enabled');
    }

    async function saveFeatureModal() {
      try {
        await apiPost(`/api/admin/users/${selectedUserUid}/features`, { features: selectedUserFeatures });
        closeFeatureModal();
        loadUsers();
      } catch (e) {
        console.error(e);
        alert('Failed to save features');
      }
    }

    function closeFeatureModal() {
      document.getElementById('featureModal').style.display = 'none';
    }

    // ========== GLOBAL SEARCH (basic) ==========
    document.getElementById('globalSearch').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      if (currentPage === 'users') {
        const filtered = allUsers.filter(u => u.email.toLowerCase().includes(query) || (u.name && u.name.toLowerCase().includes(query)));
        // temporary: re-render table with filtered users
        const container = document.getElementById('usersTableContainer');
        renderUsersTable(filtered);
      }
    });

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
      switchPage('dashboard');
    });
  </script>
</body>
</html>
