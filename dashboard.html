<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MobileControl Pro — Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070611;
  --panel:#11101d;
  --border:#29253b;
  --purple:#913cff;
  --cyan:#13c7e8;
  --green:#45e85d;
  --text:#f5f3ff;
  --muted:#858197;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 70% 10%,rgba(145,60,255,.12),transparent 30%),
    radial-gradient(circle at 20% 80%,rgba(19,199,232,.07),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

.topbar{
  height:64px;
  border-bottom:1px solid var(--border);
  background:rgba(8,7,15,.88);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(14px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
}

.brand-icon{
  width:34px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(135deg,#28cfff,#7136ff);
  display:grid;
  place-items:center;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid #5d42a2;
  display:grid;
  place-items:center;
  color:#bba8ff;
}

.user-name{
  font-size:12px;
}

.user-name small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.logout{
  border:1px solid #5b2938;
  background:rgba(255,50,80,.06);
  color:#ff7589;
  padding:8px 13px;
  border-radius:7px;
  cursor:pointer;
  font-size:11px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:35px 22px 80px;
}

.heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
}

.heading h1{
  font-size:26px;
  margin-bottom:7px;
}

.heading p{
  color:var(--muted);
  font-size:12px;
}

.uid{
  border:1px solid var(--border);
  background:var(--panel);
  padding:11px 15px;
  border-radius:8px;
  color:var(--muted);
  font-size:10px;
}

.uid span{
  color:#a979ff;
}

.panel{
  background:linear-gradient(145deg,#151422,#0e0d18);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:20px;
}

.panel-title{
  padding:15px 18px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  font-weight:bold;
}

.panel-title span{
  color:var(--purple);
}

.builder{
  padding:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#777287;
  font-size:9px;
  text-transform:uppercase;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #252237;
  border-radius:8px;
  background:#0b0a12;
  color:white;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--purple);
}

.build-btn{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:linear-gradient(90deg,#8333ef,#9c42ff);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.download-btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:var(--cyan);
  color:#031014;
  font-weight:bold;
  cursor:pointer;
  display:none;
}

.status{
  margin-top:13px;
  padding:11px;
  border-radius:7px;
  background:#0a0a12;
  color:var(--muted);
  font-size:11px;
  display:none;
}


/* =========================================
   CONNECTED DEVICES — REFERENCE STYLE
========================================= */

.devices-panel{
  background:linear-gradient(145deg,rgba(31,17,24,.98),rgba(17,11,17,.98));
  border:1px solid rgba(143,48,58,.72);
  border-radius:15px;
  box-shadow:0 0 0 1px rgba(110,35,46,.12),0 10px 30px rgba(0,0,0,.22);
}

.devices-panel .panel-title{
  padding:17px 20px;
  border-bottom:1px solid rgba(91,48,57,.52);
}

.devices-title-left{
  display:flex;
  align-items:center;
  gap:9px;
  color:#f4eef1;
  font-size:13px;
  font-weight:800;
}

.device-header-icon{
  width:17px;
  height:20px;
  display:inline-grid;
  place-items:center;
  color:#ff3544;
  font-size:19px;
  line-height:1;
  font-weight:900;
}

.device-count-badge{
  min-width:20px;
  height:20px;
  padding:0 6px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#ff3b3b;
  color:#fff;
  font-size:10px;
  font-weight:800;
}

.header-online-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 9px;
  border:1px solid rgba(255,55,65,.42);
  border-radius:999px;
  background:rgba(255,48,59,.07);
  color:#ff5b64;
  font-size:9px;
  font-weight:700;
}

.header-online-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ff3d46;
  box-shadow:0 0 7px rgba(255,61,70,.45);
}

.devices-panel .refresh{
  width:43px;
  height:30px;
  display:grid;
  place-items:center;
  border:1px solid rgba(117,86,96,.25);
  background:rgba(255,255,255,.025);
  color:#9e969d;
  padding:0;
  border-radius:999px;
  cursor:pointer;
  font-size:17px;
}

.devices-panel .refresh:hover{
  color:#fff;
  border-color:rgba(255,65,75,.35);
  background:rgba(255,55,65,.05);
}

.devices-panel th,
.devices-panel td{
  padding:15px 20px;
  border-top:1px solid rgba(88,47,57,.38);
}

.devices-panel th{
  color:#746a72;
  font-size:9px;
  letter-spacing:.05em;
}

.devices-panel td{
  color:#e6dfe2;
  font-size:11px;
}

.devices-panel tbody tr{
  transition:background .18s ease;
}

.devices-panel tbody tr:hover{
  background:rgba(255,55,65,.025);
}

.devices-panel td:first-child{
  font-weight:800;
  color:#dcd4d8;
}

.devices-panel td small{
  color:#625960;
  font-size:9px;
  letter-spacing:.02em;
}

.devices-panel .online,
.devices-panel .offline{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 12px;
  border-radius:999px;
  font-size:9px;
  font-weight:700;
}

.devices-panel .online{
  background:rgba(69,232,93,.08);
  border:1px solid rgba(69,232,93,.24);
  color:#4be862;
}

.devices-panel .offline{
  background:rgba(255,55,65,.065);
  border:1px solid rgba(255,55,65,.28);
  color:#d84d57;
}

.devices-panel .control{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:93px;
  padding:8px 12px;
  border:1px solid rgba(110,91,99,.42);
  border-radius:999px;
  background:rgba(255,255,255,.045);
  color:#c9c1c5;
  font-weight:700;
  font-size:11px;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

.devices-panel .control::after{
  content:"›";
  font-size:18px;
  line-height:10px;
  color:#8e858a;
}

.devices-panel .control:hover{
  color:#fff;
  border-color:rgba(255,70,80,.38);
  background:rgba(255,55,65,.06);
}

.devices-panel .battery-value{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-weight:700;
}

.devices-panel .battery-icon{
  position:relative;
  width:14px;
  height:7px;
  border:2px solid currentColor;
  border-radius:2px;
  display:inline-block;
}

.devices-panel .battery-icon::after{
  content:"";
  position:absolute;
  right:-4px;
  top:1px;
  width:2px;
  height:3px;
  border-radius:0 1px 1px 0;
  background:currentColor;
}

.devices-panel .battery-good{ color:#39d75a; }
.devices-panel .battery-low{ color:#e64c54; }

@media(max-width:700px){
  .devices-panel .panel-title{ padding:15px; }
  .devices-title-left{ gap:6px; flex-wrap:wrap; }
  .header-online-pill{ display:none; }
  .devices-panel th,
  .devices-panel td{ padding:14px 15px; }
}

.device-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.refresh{
  border:1px solid var(--border);
  background:transparent;
  color:#aaa2bd;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
}

.table{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

th,
td{
  padding:15px 18px;
  border-top:1px solid var(--border);
  text-align:left;
  font-size:11px;
}

th{
  color:#716d80;
  font-size:9px;
  text-transform:uppercase;
}

td small{
  display:block;
  color:#615d70;
  margin-top:4px;
}

.online{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(69,232,93,.08);
  color:var(--green);
  font-size:9px;
}

.offline{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(255,70,90,.08);
  color:#ff7180;
  font-size:9px;
}

.control{
  border:1px solid #164b5b;
  background:rgba(19,199,232,.08);
  color:var(--cyan);
  padding:7px 12px;
  border-radius:7px;
  cursor:pointer;
}

@media(max-width:700px){

  .topbar{
    padding:0 15px;
  }

  .user-name{
    display:none;
  }

  .container{
    padding:25px 14px 60px;
  }

  .heading{
    align-items:flex-start;
    flex-direction:column;
    gap:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="brand-icon">⌁</div>
    MOBILECONTROL
  </div>

  <div class="user-area">

    <div class="avatar">J</div>

    <div class="user-name">
      Welcome
      <small id="userEmail">Loading...</small>
    </div>

    <button class="logout" onclick="logout()">
      Sign Out
    </button>

  </div>

</header>


<main class="container">

  <div class="heading">

    <div>
      <h1>Command Center</h1>

      <p>
        Build applications and manage your authorized devices.
      </p>
    </div>

    <div class="uid">
      YOUR UID:
      <span id="userId">loading...</span>
    </div>

  </div>


  <!-- APK BUILDER -->

  <section class="panel">

    <div class="panel-title">
      <span>⚒</span>
      APK Builder
    </div>

    <div class="builder">

      <div class="form-grid">

        <div class="field">

          <label>App Name</label>

          <input
            id="appName"
            type="text"
            value="MobileControl Family"
          >

        </div>


        <div class="field">

          <label>Package Name</label>

          <input
            id="packageName"
            type="text"
            value="com.mobilecontrol.family"
          >

        </div>


        <div class="field full">

          <label>Build Type</label>

          <select id="buildType">

            <option value="family">
              Family Management
            </option>

            <option value="basic">
              Basic Device Management
            </option>

          </select>

        </div>

      </div>


      <button
        class="build-btn"
        onclick="buildApk()"
      >
        🚀 BUILD APK
      </button>


      <button
        class="download-btn"
        id="downloadBtn"
        onclick="downloadApk()"
      >
        ⬇ DOWNLOAD APK
      </button>


      <div
        class="status"
        id="buildStatus"
      ></div>

    </div>

  </section>


  <!-- DEVICES -->

  <section class="panel devices-panel">

    <div class="panel-title device-header">

      <div class="devices-title-left">
        <span class="device-header-icon">▯</span>
        <span>Connected Devices</span>
        <span class="device-count-badge" id="deviceCount">0</span>
        <span class="header-online-pill">
          <span class="header-online-dot"></span>
          <span id="onlineCount">0 Online</span>
        </span>
      </div>

      <button
        class="refresh"
        onclick="loadDevices()"
        aria-label="Refresh devices"
        title="Refresh devices"
      >↻</button>

    </div>

    <div class="table">
      <table>
        <thead>
          <tr>
            <th>Device</th>
            <th>Battery</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="deviceList">
          <tr>
            <td colspan="4" style="text-align:center;color:#716d80;">
              Loading devices...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </section>

</main>


<script>

/* =========================================
   CHECK LOGIN SESSION
========================================= */

async function loadUser(){

  try{

    const response = await fetch(
      "/api/me",
      {
        method:"GET",
        credentials:"same-origin",
        cache:"no-store"
      }
    );


    if(!response.ok){

      window.location.href="/";

      return;
    }


    const data = await response.json();

    const user =
      data.user || data;

    document.getElementById(
      "userEmail"
    ).textContent =
      user.email || "User";

    document.getElementById(
      "userId"
    ).textContent =
      user.id || "—";


  }catch(error){

    console.error(
      "Session check error:",
      error
    );

    window.location.href="/";

  }

}


/* =========================================
   LOAD DEVICES
========================================= */

async function loadDevices(){

  const list =
    document.getElementById(
      "deviceList"
    );

  list.innerHTML=`
    <tr>
      <td
        colspan="4"
        style="text-align:center;color:#716d80;"
      >
        Loading devices...
      </td>
    </tr>
  `;

  try{

    const response =
      await fetch(
        "/api/devices",
        {
          credentials:"same-origin"
        }
      );

    if(!response.ok){
      throw new Error("Failed to load devices");
    }

    const devices =
      await response.json();

    if(!Array.isArray(devices) ||
       devices.length===0){

      showNoDevices();

      return;
    }

    document.getElementById(
      "deviceCount"
    ).textContent =
      devices.length;

    const onlineDevices =
      devices.filter(device => Boolean(device.online)).length;

    const onlineCount =
      document.getElementById("onlineCount");

    if(onlineCount){
      onlineCount.textContent = `${onlineDevices} Online`;
    }

    list.innerHTML =
      devices.map(device => {

        const battery = Number(device.battery);
        const hasBattery =
          device.battery !== null &&
          device.battery !== undefined &&
          device.battery !== "" &&
          Number.isFinite(battery);

        const batteryClass =
          hasBattery && battery <= 15
            ? "battery-low"
            : "battery-good";

        const batteryText =
          hasBattery ? `${escapeHtml(device.battery)}%` : "—";

        return `
          <tr>
            <td>
              ${escapeHtml(device.name || "Unknown Device")}
              <small>${escapeHtml(device.device_id || "")}</small>
            </td>

            <td>
              <span class="battery-value ${batteryClass}">
                ${hasBattery ? '<span class="battery-icon"></span>' : ""}
                ${batteryText}
              </span>
            </td>

            <td>
              ${
                device.online
                  ? `<span class="online">● Online</span>`
                  : `<span class="offline">● Offline</span>`
              }
            </td>

            <td>
              <button
                class="control"
                onclick="openControl('${encodeURIComponent(device.device_id || "")}')"
              >
                Control
              </button>
            </td>
          </tr>
        `;
      }).join("");


  }catch(error){

    console.error(error);

    showNoDevices();

  }

}


function showNoDevices(){

  document.getElementById(
    "deviceCount"
  ).textContent="0";

  const onlineCount =
    document.getElementById("onlineCount");

  if(onlineCount){
    onlineCount.textContent="0 Online";
  }

  document.getElementById(
    "deviceList"
  ).innerHTML=`

    <tr>

      <td
        colspan="4"
        style="
          text-align:center;
          color:#716d80;
          padding:30px;
        "
      >

        No authorized devices connected.

      </td>

    </tr>

  `;

}


/* =========================================
   APK BUILDER (unchanged)
========================================= */

async function buildApk(){

  const status =
    document.getElementById(
      "buildStatus"
    );

  const download =
    document.getElementById(
      "downloadBtn"
    );

  const appName =
    document.getElementById(
      "appName"
    ).value.trim();

  const packageName =
    document.getElementById(
      "packageName"
    ).value.trim();

  const buildType =
    document.getElementById(
      "buildType"
    ).value;

  if(!appName || !packageName){

    status.style.display="block";

    status.textContent =
      "Please fill in all required fields.";

    return;

  }

  status.style.display="block";

  status.textContent =
    "Build request is being prepared...";

  download.style.display="none";

  try{

    const response =
      await fetch(
        "/api/build-apk",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          credentials:"same-origin",

          body:JSON.stringify({
            appName,
            packageName,
            buildType
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      status.textContent =
        data.error ||
        "Build request failed.";

      return;

    }

    status.textContent =
      "Build started successfully.";

    if(data.downloadUrl){

      download.style.display="block";

      download.dataset.url =
        data.downloadUrl;

    }

  }catch(error){

    console.error(error);

    status.textContent =
      "APK builder backend is not connected yet.";

  }

}


/* =========================================
   DOWNLOAD APK
========================================= */

function downloadApk(){

  const url =
    document.getElementById(
      "downloadBtn"
    ).dataset.url;

  if(url){

    window.location.href=url;

  }

}


/* =========================================
   DEVICE CONTROL (updated)
========================================= */

function openControl(deviceId){

  if(deviceId && deviceId !== "undefined"){
    window.location.href = `/control?deviceId=${encodeURIComponent(deviceId)}`;
  } else {
    alert("Device ID missing.");
  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  try{

    await fetch(
      "/api/logout",
      {
        method:"POST",
        credentials:"same-origin"
      }
    );

  }catch(error){

    console.error(error);

  }

  window.location.href="/";

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   START
========================================= */

loadUser();
loadDevices();

</script>

</body>
</html>
