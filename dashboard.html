<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MobileControl Pro — Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070611;
  --panel:#11101d;
  --border:#29253b;
  --purple:#913cff;
  --cyan:#13c7e8;
  --green:#45e85d;
  --text:#f5f3ff;
  --muted:#858197;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 70% 10%,rgba(145,60,255,.12),transparent 30%),
    radial-gradient(circle at 20% 80%,rgba(19,199,232,.07),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

.topbar{
  height:64px;
  border-bottom:1px solid var(--border);
  background:rgba(8,7,15,.88);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(14px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
}

.brand-icon{
  width:34px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(135deg,#28cfff,#7136ff);
  display:grid;
  place-items:center;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid #5d42a2;
  display:grid;
  place-items:center;
  color:#bba8ff;
}

.user-name{
  font-size:12px;
}

.user-name small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.logout{
  border:1px solid #5b2938;
  background:rgba(255,50,80,.06);
  color:#ff7589;
  padding:8px 13px;
  border-radius:7px;
  cursor:pointer;
  font-size:11px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:35px 22px 80px;
}

.heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
}

.heading h1{
  font-size:26px;
  margin-bottom:7px;
}

.heading p{
  color:var(--muted);
  font-size:12px;
}

.uid{
  border:1px solid var(--border);
  background:var(--panel);
  padding:11px 15px;
  border-radius:8px;
  color:var(--muted);
  font-size:10px;
}

.uid span{
  color:#a979ff;
}

.panel{
  background:linear-gradient(145deg,#151422,#0e0d18);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:20px;
}

.panel-title{
  padding:15px 18px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  font-weight:bold;
}

.panel-title span{
  color:var(--purple);
}

.builder{
  padding:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  color:#777287;
  font-size:9px;
  text-transform:uppercase;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #252237;
  border-radius:8px;
  background:#0b0a12;
  color:white;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--purple);
}

.build-btn{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:linear-gradient(90deg,#8333ef,#9c42ff);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.download-btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:var(--cyan);
  color:#031014;
  font-weight:bold;
  cursor:pointer;
  display:none;
}

.status{
  margin-top:13px;
  padding:11px;
  border-radius:7px;
  background:#0a0a12;
  color:var(--muted);
  font-size:11px;
  display:none;
}

.device-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.refresh{
  border:1px solid var(--border);
  background:transparent;
  color:#aaa2bd;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
}

.table{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}

th,
td{
  padding:15px 18px;
  border-top:1px solid var(--border);
  text-align:left;
  font-size:11px;
}

th{
  color:#716d80;
  font-size:9px;
  text-transform:uppercase;
}

td small{
  display:block;
  color:#615d70;
  margin-top:4px;
}

.online{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(69,232,93,.08);
  color:var(--green);
  font-size:9px;
}

.offline{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(255,70,90,.08);
  color:#ff7180;
  font-size:9px;
}

.control{
  border:1px solid #164b5b;
  background:rgba(19,199,232,.08);
  color:var(--cyan);
  padding:7px 12px;
  border-radius:7px;
  cursor:pointer;
}

@media(max-width:700px){

  .topbar{
    padding:0 15px;
  }

  .user-name{
    display:none;
  }

  .container{
    padding:25px 14px 60px;
  }

  .heading{
    align-items:flex-start;
    flex-direction:column;
    gap:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="brand-icon">⌁</div>
    MOBILECONTROL
  </div>

  <div class="user-area">

    <div class="avatar">J</div>

    <div class="user-name">
      Welcome
      <small id="userEmail">Loading...</small>
    </div>

    <button class="logout" onclick="logout()">
      Sign Out
    </button>

  </div>

</header>


<main class="container">

  <div class="heading">

    <div>
      <h1>Command Center</h1>

      <p>
        Build applications and manage your authorized devices.
      </p>
    </div>

    <div class="uid">
      YOUR UID:
      <span id="userId">loading...</span>
    </div>

  </div>


  <!-- APK BUILDER -->

  <section class="panel">

    <div class="panel-title">
      <span>⚒</span>
      APK Builder
    </div>

    <div class="builder">

      <div class="form-grid">

        <div class="field">

          <label>App Name</label>

          <input
            id="appName"
            type="text"
            value="MobileControl Family"
          >

        </div>


        <div class="field">

          <label>Package Name</label>

          <input
            id="packageName"
            type="text"
            value="com.mobilecontrol.family"
          >

        </div>


        <div class="field full">

          <label>Build Type</label>

          <select id="buildType">

            <option value="family">
              Family Management
            </option>

            <option value="basic">
              Basic Device Management
            </option>

          </select>

        </div>

      </div>


      <button
        class="build-btn"
        onclick="buildApk()"
      >
        🚀 BUILD APK
      </button>


      <button
        class="download-btn"
        id="downloadBtn"
        onclick="downloadApk()"
      >
        ⬇ DOWNLOAD APK
      </button>


      <div
        class="status"
        id="buildStatus"
      ></div>

    </div>

  </section>


  <!-- DEVICES -->

  <section class="panel">

    <div class="panel-title device-header">

      <div>
        📱 Connected Devices
        <span style="color:#a979ff;" id="deviceCount">0</span>
      </div>

      <button
        class="refresh"
        onclick="loadDevices()"
      >
        ↻
      </button>

    </div>


    <div class="table">

      <table>

        <thead>

          <tr>
            <th>Device</th>
            <th>Battery</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>


        <tbody id="deviceList">

          <tr>

            <td
              colspan="4"
              style="text-align:center;color:#716d80;"
            >
              Loading devices...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script>

/* =========================================
   CHECK LOGIN SESSION
========================================= */

async function loadUser(){

  try{

    const response = await fetch(
      "/api/me",
      {
        method:"GET",
        credentials:"same-origin",
        cache:"no-store"
      }
    );


    if(!response.ok){

      // Login page is index.html
      window.location.href="/";

      return;
    }


    const data = await response.json();


    /*
      Server returns:

      {
        authenticated:true,
        id:...,
        email:...
      }

      It also supports data.user.
    */

    const user =
      data.user || data;


    document.getElementById(
      "userEmail"
    ).textContent =
      user.email || "User";


    document.getElementById(
      "userId"
    ).textContent =
      user.id || "—";


  }catch(error){

    console.error(
      "Session check error:",
      error
    );

    window.location.href="/";

  }

}


/* =========================================
   LOAD DEVICES
========================================= */

async function loadDevices(){

  const list =
    document.getElementById(
      "deviceList"
    );


  list.innerHTML=`
    <tr>
      <td
        colspan="4"
        style="text-align:center;color:#716d80;"
      >
        Loading devices...
      </td>
    </tr>
  `;


  try{

    const response =
      await fetch(
        "/api/devices",
        {
          credentials:"same-origin"
        }
      );


    /*
      API doesn't exist yet.
      Don't kick the user out of dashboard.
    */

    if(response.status===404){

      showNoDevices();

      return;
    }


    if(!response.ok){

      throw new Error(
        "Could not load devices"
      );

    }


    const devices =
      await response.json();


    if(!Array.isArray(devices) ||
       devices.length===0){

      showNoDevices();

      return;
    }


    document.getElementById(
      "deviceCount"
    ).textContent =
      devices.length;


    list.innerHTML =
      devices.map(
        device => `

        <tr>

          <td>

            ${escapeHtml(
              device.name ||
              "Unknown Device"
            )}

            <small>
              ${escapeHtml(
                device.id || ""
              )}
            </small>

          </td>


          <td>
            ${
              device.battery ??
              "—"
            }%
          </td>


          <td>

            ${
              device.online

              ? `<span class="online">
                   ● Online
                 </span>`

              : `<span class="offline">
                   ● Offline
                 </span>`
            }

          </td>


          <td>

            <button
              class="control"
              onclick="openControl('${encodeURIComponent(
                device.id || ""
              )}')"
            >
              Control
            </button>

          </td>

        </tr>

      `
      ).join("");


  }catch(error){

    console.error(error);

    showNoDevices();

  }

}


function showNoDevices(){

  document.getElementById(
    "deviceCount"
  ).textContent="0";


  document.getElementById(
    "deviceList"
  ).innerHTML=`

    <tr>

      <td
        colspan="4"
        style="
          text-align:center;
          color:#716d80;
          padding:30px;
        "
      >

        No authorized devices connected.

      </td>

    </tr>

  `;

}


/* =========================================
   APK BUILDER
========================================= */

async function buildApk(){

  const status =
    document.getElementById(
      "buildStatus"
    );


  const download =
    document.getElementById(
      "downloadBtn"
    );


  const appName =
    document.getElementById(
      "appName"
    ).value.trim();


  const packageName =
    document.getElementById(
      "packageName"
    ).value.trim();


  const buildType =
    document.getElementById(
      "buildType"
    ).value;


  if(!appName || !packageName){

    status.style.display="block";

    status.textContent =
      "Please fill in all required fields.";

    return;

  }


  status.style.display="block";

  status.textContent =
    "Build request is being prepared...";


  download.style.display="none";


  try{

    const response =
      await fetch(
        "/api/build-apk",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          credentials:"same-origin",

          body:JSON.stringify({
            appName,
            packageName,
            buildType
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      status.textContent =
        data.error ||
        "Build request failed.";

      return;

    }


    status.textContent =
      "Build started successfully.";


    if(data.downloadUrl){

      download.style.display="block";

      download.dataset.url =
        data.downloadUrl;

    }

  }catch(error){

    console.error(error);

    status.textContent =
      "APK builder backend is not connected yet.";

  }

}


/* =========================================
   DOWNLOAD APK
========================================= */

function downloadApk(){

  const url =
    document.getElementById(
      "downloadBtn"
    ).dataset.url;


  if(url){

    window.location.href=url;

  }

}


/* =========================================
   DEVICE CONTROL
========================================= */

function openControl(id){

  alert(
    "Device control will be added later."
  );

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  try{

    await fetch(
      "/api/logout",
      {
        method:"POST",
        credentials:"same-origin"
      }
    );

  }catch(error){

    console.error(error);

  }


  // Login is inside index.html
  window.location.href="/";

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   START
========================================= */

loadUser();
loadDevices();

</script>

</body>
</html>
